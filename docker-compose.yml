services:
  db:
    image: postgres:17-alpine
    container_name: habit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: habit
      POSTGRES_PASSWORD: habit
      POSTGRES_DB: habit
    ports:
      - "5432:5432"
    volumes:
      - habit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habit -d habit"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: habit-backend
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: postgres://habit:habit@db:5432/habit?sslmode=disable
      CORS_ORIGINS: "*"
      APP_ENV: development
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # Optional HTTPS reverse proxy for the API (used by the GitHub Pages frontend).
  # Start with: $env:API_DOMAIN="api.example.com"; docker compose --profile tls up -d
  caddy:
    image: caddy:2-alpine
    container_name: habit-caddy
    restart: unless-stopped
    profiles: ["tls"]
    environment:
      API_DOMAIN: ${API_DOMAIN:-}
    command:
      - sh
      - -c
      - |
        if [ -z "$$API_DOMAIN" ]; then
          echo "API_DOMAIN is not set. Run: API_DOMAIN=api.example.com docker compose --profile tls up -d" >&2
          exit 1
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

