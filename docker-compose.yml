services:
  db:
    image: postgres:17-alpine
    container_name: habit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: habit
      POSTGRES_PASSWORD: habit
      POSTGRES_DB: habit
    ports:
      - "5432:5432"
    volumes:
      - habit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habit -d habit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  habit_pgdata:
