services:
  db:
    image: postgres:17-alpine
    container_name: habit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: habit
      POSTGRES_PASSWORD: habit
      POSTGRES_DB: habit
    ports:
      - "5432:5432"
    volumes:
      - habit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habit -d habit"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: habit-backend
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: postgres://habit:habit@db:5432/habit?sslmode=disable
      CORS_ORIGINS: http://localhost:3000
      APP_ENV: development
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  habit_pgdata:
